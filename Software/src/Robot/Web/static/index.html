<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Robot Control</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --sidebar-bg: #161616;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --border: #262626;
            --term-bg: #0c0c0c;
            --term-text: #00ff00;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebars */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-right {
            border-left: 1px solid var(--border);
            border-right: none;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Controls */
        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            background: #202020;
            border: 1px solid var(--border);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: #202020;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            margin-bottom: 6px;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #333;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            text-align: center;
        }

        .btn.primary:hover {
            background: #2563eb;
        }

        .btn.danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
            text-align: center;
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Toggle */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(18px);
        }

        /* Term */
        #logPanel {
            background: var(--term-bg);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            flex-grow: 1;
            overflow-y: auto;
            color: var(--term-text);
        }

        .log-entry {
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .log-entry.sim {
            color: #facc15;
        }

        .log-entry.error {
            color: var(--danger);
        }

        /* Main Canvas Area */
        #main-area {
            flex-grow: 1;
            position: relative;
            background: #080808;
            overflow: hidden;
            cursor: grab;
        }

        #main-area:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        /* Stats Lists */
        .item-list {
            font-size: 0.8rem;
        }

        .list-item {
            padding: 6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
        }

        .list-item span {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        #config-panel {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: none;
        }

        #config-panel.visible {
            display: block;
        }

        /* Tools Overlay */
        #tools-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #tools-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Stain Draggable Hint */
        .stain-tool-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .stain-tool-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>

<body>

    <!-- Left Sidebar: Controls -->
    <div class="sidebar">
        <div>
            <h1>SolarBot</h1>
            <div id="connection-status" style="font-size:0.7rem; color:#666;">Offline</div>
        </div>

        <div class="toggle-row">
            <span style="font-size:0.9rem">Sim Mode</span>
            <label class="switch">
                <input type="checkbox" id="simToggle" onchange="toggleSimMode()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span style="font-size:0.9rem">Show Path</span>
            <label class="switch">
                <input type="checkbox" id="pathToggle" checked onchange="togglePath()">
                <span class="slider"></span>
            </label>
        </div>

        <div id="config-panel">
            <div class="section-title">Virtual Panel</div>
            <div class="form-group">
                <label class="form-label">Width (cm)</label>
                <input type="number" id="simWidth" class="form-input" value="200" min="50" oninput="updateSimConfig()">
            </div>
            <div class="form-group">
                <label class="form-label">Height (cm)</label>
                <input type="number" id="simHeight" class="form-input" value="150" min="50" oninput="updateSimConfig()">
            </div>
            <div class="form-group">
                <label class="form-label">Robot Size (cm)</label>
                <input type="number" id="simRobotSize" class="form-input" value="28" min="10"
                    oninput="updateSimConfig()">
            </div>
            <div class="form-group">
                <label class="form-label">Overlap (%)</label>
                <input type="number" id="simOverlap" class="form-input" value="0.5" min="0.1" max="0.9" step="0.1"
                    oninput="updateSimConfig()">
            </div>
            <button class="btn" onclick="resetSim()">Reset Position</button>
        </div>

        <div>
            <div class="section-title">Actions</div>
            <button id="btnMap" class="btn primary" onclick="startMapping()">Start Mapping</button>
            <button id="btnPlan" class="btn" onclick="sendCommand('start_navigation')">Plan Path</button>
            <button id="btnExec" class="btn" onclick="sendCommand('start_execution')">Start Cleaning</button>
            <button class="btn danger" onclick="sendCommand('stop')">STOP</button>
        </div>

        <div style="flex-grow:1; display:flex; flex-direction:column;">
            <div class="section-title">Log</div>
            <div id="logPanel">
                <div class="log-entry">System ready.</div>
            </div>
        </div>
    </div>

    <!-- Main Area -->
    <div id="main-area" onwheel="handleZoom(event)" onmousedown="handleMouseDown(event)"
        onmousemove="handleMouseMove(event)" onmouseup="handleMouseUp(event)">
        <div id="tools-overlay">
            <button class="stain-tool-btn" onclick="spawnStain()">+ Spawn Dirt</button>
            <span style="font-size:0.8rem; color:#888; align-self:center;">Drag dirt to place it</span>
        </div>
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- Right Sidebar: Info -->
    <div class="sidebar sidebar-right">
        <div>
            <div class="section-title">System Status</div>
            <div class="list-item">State <span id="state">IDLE</span></div>
            <div class="list-item">Pose X <span id="poseX">0</span></div>
            <div class="list-item">Pose Y <span id="poseY">0</span></div>
        </div>

        <div>
            <div class="section-title">Detected Stains</div>
            <div style="font-size:0.8rem; color:#888; margin-bottom:8px;" id="stain-header">0 Anomalies</div>
            <div id="stain-list" class="item-list">
                <!-- Items injected here -->
            </div>
        </div>

        <div>
            <div class="section-title">Map Info</div>
            <div class="list-item">Area Scanned <span id="area-scanned">0%</span></div>
            <div class="list-item">Perimeter <span id="perimeter-pts">0 pts</span></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://" + window.location.host + "/ws");

        const canvas = document.getElementById("mapCanvas");
        const ctx = canvas.getContext("2d");
        const mainArea = document.getElementById("main-area");

        // UI Elements
        const logPanel = document.getElementById("logPanel");
        const configPanel = document.getElementById("config-panel");
        const toolsOverlay = document.getElementById("tools-overlay");
        const stainList = document.getElementById("stain-list");

        // Inputs
        const inpW = document.getElementById("simWidth");
        const inpH = document.getElementById("simHeight");
        const inpSize = document.getElementById("simRobotSize");

        let simMode = false;
        // Viewport
        let view = { x: 50, y: 600, scale: 2.0 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };

        // State
        let robot = { x: 50, y: 50, dir: "UP", angle: 0.0 };
        let mapPoints = [];
        let detectedStains = [];
        let pathHistory = [];
        let plannedPath = [];
        let showPath = true;

        // Sim Objects
        let simStains = []; // {x, y, id, dragging}
        let draggedStain = null;

        // Resize Canvas
        function resize() {
            canvas.width = mainArea.clientWidth;
            canvas.height = mainArea.clientHeight;
            draw();
        }
        window.onresize = resize;
        setTimeout(resize, 100);

        // --- Inputs ---

        function toggleSimMode() {
            simMode = document.getElementById("simToggle").checked;
            const btnPlan = document.getElementById("btnPlan");
            const btnExec = document.getElementById("btnExec");

            if (simMode) {
                configPanel.classList.add("visible");
                toolsOverlay.classList.add("visible");
                document.getElementById("btnMap").innerText = "Start Mapping (Sim)";

                // Hide manual steps in sim
                btnPlan.style.display = "none";
                btnExec.style.display = "none";

                log("Sim Mode ENABLED", "sim");
                // Send initial config
                updateSimConfig();
            } else {
                configPanel.classList.remove("visible");
                toolsOverlay.classList.remove("visible");
                document.getElementById("btnMap").innerText = "Start Mapping";

                // Show steps for real mode
                btnPlan.style.display = "inline-block";
                btnExec.style.display = "inline-block";
            }
            draw();
        }

        function togglePath() {
            showPath = document.getElementById("pathToggle").checked;
            draw();
        }

        function updateSimConfig() {
            if (!simMode) return;
            const w = parseInt(inpW.value) || 100;
            const h = parseInt(inpH.value) || 100;
            const s = parseInt(inpSize.value) || 28;
            const o = parseFloat(document.getElementById("simOverlap").value) || 0.5;

            draw();

            ws.send(JSON.stringify({
                cmd: "set_sim_config",
                w: w, h: h, size: s, overlap: o
            }));
        }

        function sendStains() {
            ws.send(JSON.stringify({
                cmd: "update_sim_stains",
                stains: simStains.map(s => ({ x: s.x, y: s.y }))
            }));
        }

        function spawnStain() {
            // Spawn in center of view
            // Convert screen center to world
            const cx = (canvas.width / 2 - view.x) / view.scale;
            const cy = (canvas.height / 2 - view.y) / view.scale;

            simStains.push({
                x: cx, y: cy,
                id: Date.now()
            });
            sendStains();
            draw();
            log("Spawned Dirt", "sim");
        }

        function resetSim() {
            sendCommand("reset_sim");
            simStains = [];
            sendStains();
            mapPoints = [];
            detectedStains = [];
            pathHistory = [];
            plannedPath = [];
            updateStainList();
            log("Sim Reset", "sim");
        }

        // --- Interaction ---

        function worldToScreen(wx, wy) {
            return {
                x: wx * view.scale + view.x,
                y: view.y - wy * view.scale
            };
        }

        function screenToWorld(sx, sy) {
            return {
                x: (sx - view.x) / view.scale,
                y: (view.y - sy) / view.scale
            };
        }

        function handleZoom(e) {
            e.preventDefault();
            const zoomSpeed = 0.1;
            const delta = e.deltaY > 0 ? (1 - zoomSpeed) : (1 + zoomSpeed);

            // Zoom towards mouse
            const mouseWorld = screenToWorld(e.offsetX, e.offsetY);

            view.scale *= delta;

            // Adjust view.x/y so mouseWorld remains at screen pos
            // screen = world * scale + x
            // Adjust view.x/y so mouseWorld remains at screen pos
            view.x = e.offsetX - mouseWorld.x * view.scale;
            view.y = e.offsetY + mouseWorld.y * view.scale;

            draw();
        }

        function handleMouseDown(e) {
            lastMouse = { x: e.offsetX, y: e.offsetY };
            const mWorld = screenToWorld(e.offsetX, e.offsetY);

            // Check stain drag
            if (simMode) {
                for (let i = simStains.length - 1; i >= 0; i--) {
                    const s = simStains[i];
                    const dx = mWorld.x - s.x;
                    const dy = mWorld.y - s.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 15) { // 15cm radius hit
                        draggedStain = s;
                        isDragging = true;
                        return;
                    }
                }
            }

            // Pan
            isDragging = true;
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.offsetX - lastMouse.x;
            const dy = e.offsetY - lastMouse.y;
            lastMouse = { x: e.offsetX, y: e.offsetY };

            if (draggedStain) {
                const mWorld = screenToWorld(e.offsetX, e.offsetY);
                draggedStain.x = mWorld.x;
                draggedStain.y = mWorld.y;
                draw();
            } else {
                view.x += dx;
                view.y += dy;
                draw();
            }
        }

        function handleMouseUp(e) {
            isDragging = false;
            if (draggedStain) {
                draggedStain = null;
                sendStains(); // Update backend
            }
        }

        // --- Backend ---

        function startMapping() {
            if (simMode) updateSimConfig();
            sendCommand("start_mapping");
        }

        function sendCommand(cmd) {
            ws.send(JSON.stringify({ cmd: cmd }));
        }

        ws.onopen = () => {
            document.getElementById("connection-status").innerText = "Online";
            document.getElementById("connection-status").style.color = "var(--success)";
            if (simMode) updateSimConfig();
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === "pose") {
                    robot.x = msg.x; robot.y = msg.y;
                    if (msg.angle !== undefined) robot.angle = msg.angle;

                    document.getElementById("poseX").innerText = msg.x.toFixed(1);
                    document.getElementById("poseY").innerText = msg.y.toFixed(1);
                    pathHistory.push({ x: msg.x, y: msg.y });
                    if (pathHistory.length > 5000) pathHistory.shift();
                    draw();
                } else if (msg.type === "map_point") {
                    mapPoints.push({ x: msg.x, y: msg.y });
                    document.getElementById("perimeter-pts").innerText = mapPoints.length + " pts";
                    draw();
                } else if (msg.type === "planned_path") {
                    plannedPath = msg.path;
                    log("Received Plan: " + plannedPath.length + " pts", "sim");
                    draw();
                } else if (msg.type === "stain_found") {
                    detectedStains.push(msg);
                    updateStainList();
                    log(`Anomaly Detect: ${msg.score.toFixed(0)}%`, "error");
                    draw();
                } else if (msg.type === "status") {
                    document.getElementById("state").innerText = msg.status;
                    log(msg.msg);
                }
            } catch (e) { }
        };

        function updateStainList() {
            document.getElementById("stain-header").innerText = detectedStains.length + " Anomalies";
            stainList.innerHTML = "";
            detectedStains.forEach((s, i) => {
                const div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `Stain #${i + 1} <span>${s.x.toFixed(0)},${s.y.toFixed(0)}</span>`;
                stainList.prepend(div);
            });
        }

        function log(msg, type = "") {
            const d = document.createElement("div");
            d.className = "log-entry " + type;
            d.innerText = "> " + msg;
            logPanel.prepend(d);
        }

        // --- Drawing ---

        function draw() {
            ctx.fillStyle = "#080808";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = parseInt(inpW.value) || 200;
            const h = parseInt(inpH.value) || 150;
            const rSize = parseInt(inpSize.value) || 28;

            // Draw Grid (World Space)
            const gridSize = 50; // 50cm grid
            ctx.lineWidth = 1;
            ctx.strokeStyle = "#1a1a1a";

            const startX = Math.floor(-view.x / view.scale / gridSize) * gridSize;
            const endX = Math.floor((canvas.width - view.x) / view.scale / gridSize + 1) * gridSize;

            // Y Flipped
            const startY = Math.floor((view.y - canvas.height) / view.scale / gridSize) * gridSize;
            const endY = Math.floor(view.y / view.scale / gridSize + 1) * gridSize;

            ctx.beginPath();
            for (let x = startX; x <= endX; x += gridSize) {
                const s = worldToScreen(x, 0);
                ctx.moveTo(s.x, 0); ctx.lineTo(s.x, canvas.height);
            }
            for (let y = startY; y <= endY; y += gridSize) {
                const s = worldToScreen(0, y);
                ctx.moveTo(0, s.y); ctx.lineTo(canvas.width, s.y);
            }
            ctx.stroke();

            // Draw Sim Boundary (Dashed Blue)
            if (simMode) {
                const tl = worldToScreen(0, 0);
                const br = worldToScreen(w, h);
                ctx.strokeStyle = "#2563eb";
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
                ctx.setLineDash([]);
            }

            // Draw Map Points (Blue Blocks)
            ctx.fillStyle = "#2563eb";
            const blockSize = view.scale * 4; // Arbitrary visualization size
            for (let p of mapPoints) {
                const s = worldToScreen(p.x, p.y);
                ctx.fillRect(s.x, s.y, blockSize, blockSize);
            }

            // Draw True Stains (Sim Only) - Gray Dirt
            if (simMode) {
                ctx.fillStyle = "#444";
                for (let s of simStains) {
                    const scr = worldToScreen(s.x, s.y);
                    ctx.beginPath();
                    ctx.arc(scr.x, scr.y, 15 * view.scale, 0, Math.PI * 2); // 15cm radius
                    ctx.fill();
                    // Outline
                    ctx.strokeStyle = "#666";
                    ctx.stroke();
                }
            }

            // Draw Detected Stains (Red Circles)
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            for (let s of detectedStains) {
                const scr = worldToScreen(s.x, s.y);
                ctx.beginPath();
                ctx.arc(scr.x, scr.y, 15 * view.scale, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Path History
            if (showPath && pathHistory.length > 1) {
                ctx.strokeStyle = "#10b981"; // Emerald Green
                ctx.lineWidth = 2;
                ctx.beginPath();
                const start = worldToScreen(pathHistory[0].x, pathHistory[0].y);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < pathHistory.length; i++) {
                    const p = worldToScreen(pathHistory[i].x, pathHistory[i].y);
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            // Draw Planned Path (Yellow)
            if (plannedPath.length > 1) {
                ctx.strokeStyle = "#fbbf24"; // Amber-400
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]);
                ctx.beginPath();
                const start = worldToScreen(plannedPath[0].x, plannedPath[0].y);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < plannedPath.length; i++) {
                    const p = worldToScreen(plannedPath[i].x, plannedPath[i].y);
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            const rob = worldToScreen(robot.x, robot.y);
            const rDim = rSize * view.scale;

            ctx.save();
            ctx.translate(rob.x, rob.y);
            ctx.rotate(-robot.angle);

            ctx.fillStyle = "#fff";
            ctx.fillRect(-rDim / 2, -rDim / 2, rDim, rDim);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(-rDim / 2, -rDim / 2, rDim, rDim);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, rDim / 2);
            ctx.stroke();

            ctx.restore();

            const org = worldToScreen(0, 0);
            ctx.fillStyle = "#333";
            ctx.fillRect(org.x - 2, org.y - 2, 4, 4);
        }

        toggleSimMode();

    </script>
</body>

</html>
