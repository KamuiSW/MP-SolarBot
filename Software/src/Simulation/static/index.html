<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarBot Control</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #18181b;
            --border: #27272a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
            position: relative;
            min-width: 200px;
            max-width: 500px;
        }

        .sidebar-right {
            border-left: 1px solid var(--border);
            border-right: none;
            right: 0;
        }

        .resize-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            background: transparent;
            z-index: 30;
            transition: background 0.2s;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: var(--primary);
        }

        .resize-left {
            right: -2px;
        }

        .resize-right {
            left: -2px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="number"] {
            background: #27272a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background: #27272a;
            color: white;
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        button:hover {
            background: #3f3f46;
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        button.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        #main-view {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            cursor: grab;
        }

        #main-view:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        #tools-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .metric-val {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
        }

        .detections-panel {
            flex-grow: 1;
            overflow-y: auto;
            min-height: 100px;
        }
    </style>
</head>

<body>

    <div class="sidebar" id="sidebar-left">
        <div class="resize-handle resize-left" onmousedown="startResize(event, 'left')"></div>
        <div>
            <h1>SolarBot</h1>
        </div>

        <div class="control-group">
            <div class="section-header">Simulation</div>
            <label style="font-size:0.85rem; color:#aaa;">
                <input type="checkbox" id="pathToggle" checked onchange="draw()">
                Show path
            </label>
            <input type="number" id="simW" placeholder="Width (cm)" value="200" onchange="updateConfig()">
            <input type="number" id="simH" placeholder="Height (cm)" value="150" onchange="updateConfig()">
            <input type="number" id="simSize" placeholder="Robot (cm)" value="28" onchange="updateConfig()">
            <button onclick="resetSim()">Reset Position</button>
            <div style="width:100%; height:1px; background:#333; margin:4px 0;"></div>

            <div style="display:flex; gap:4px;">
                <button style="flex:1" onclick="togglePause()">Pause</button>
                <button class="danger" style="flex:1" onclick="wsSend('stop')">Stop</button>
            </div>

            <div style="font-size:0.8rem; color:#aaa; margin-top:4px;">
                Speed: <span id="speedVal">1.0x</span>
            </div>
            <input type="range" min="1" max="5" step="0.5" value="1" oninput="setSpeed(this.value)" style="width:100%">
        </div>

        <div class="control-group">
            <div class="section-header">Actions</div>
            <button id="btnMap" class="primary" onclick="actionMapping()">Start Simulation</button>
            <button class="danger" onclick="wsSend('stop')">Stop</button>
        </div>
    </div>

    <div id="main-view">
        <div id="tools-overlay">
            <button class="danger" onclick="spawnStain()" style="background:transparent; border:1px solid #ef4444;">+
                Add Dirt</button>
            <span style="align-self:center; font-size:0.8rem; color:#aaa;">Drag to move</span>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="sidebar sidebar-right" id="sidebar-right">
        <div class="resize-handle resize-right" onmousedown="startResize(event, 'right')"></div>
        <div class="control-group">
            <div class="section-header">Detections</div>
            <div class="metric-row"><span>Points</span> <span id="pts-count" class="metric-val">0</span></div>
            <div class="metric-row"><span>Detected</span> <span id="stain-count" class="metric-val"
                    style="color:#ef4444">0</span></div>
            <button onclick="clearDetections()" style="margin-top:8px; font-size:0.8rem;">Clear Detections</button>
        </div>

        <div class="detections-panel">
            <div class="section-header">Detections List</div>
            <div id="stain-list"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://" + window.location.host + "/ws");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const viewDiv = document.getElementById("main-view");

        const imgPanel = new Image(); imgPanel.src = "assets/solar_panel.jpg";
        const imgDirt = new Image(); imgDirt.src = "assets/dirt.png";
        let assetsLoaded = 0;
        imgPanel.onload = () => { assetsLoaded++; draw(); };
        imgPanel.onerror = () => { console.warn("Panel tex missing"); draw(); };
        imgDirt.onload = () => { assetsLoaded++; draw(); };
        imgDirt.onerror = () => { console.warn("Dirt tex missing"); draw(); };

        let robot = { x: 50, y: 50, angle: 0 };
        let view = { x: 50, y: 600, scale: 2.5 };
        let dragging = false, lastMouse = { x: 0, y: 0 };
        let mapPts = [], path = [], plan = [], stains = [], foundStains = [];
        let draggedStain = null;

        function resize() {
            canvas.width = viewDiv.clientWidth;
            canvas.height = viewDiv.clientHeight;
            draw();
        }
        window.onresize = resize;
        setTimeout(resize, 100);

        function startResize(e, side) {
            e.preventDefault();
            const sidebar = document.getElementById(side === 'left' ? 'sidebar-left' : 'sidebar-right');
            const startX = e.clientX;
            const startWidth = sidebar.offsetWidth;

            function doDrag(ev) {
                const diff = side === 'left' ? (ev.clientX - startX) : (startX - ev.clientX);
                const newW = Math.max(200, Math.min(600, startWidth + diff));
                sidebar.style.width = newW + 'px';
                resize();
            }

            function stopDrag() {
                document.removeEventListener('mousemove', doDrag);
                document.removeEventListener('mouseup', stopDrag);
            }

            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        viewDiv.addEventListener("mousedown", e => {
            const m = screenToWorld(e.offsetX, e.offsetY);
            lastMouse = { x: e.offsetX, y: e.offsetY };

            for (let s of stains) {
                const dx = m.x - s.x;
                const dy = m.y - s.y;
                if (Math.hypot(dx, dy) < 15) {
                    draggedStain = s;
                    dragging = true;
                    return;
                }
            }

            dragging = true;
        });

        viewDiv.addEventListener("mousemove", e => {
            if (!dragging) return;
            const dx = e.offsetX - lastMouse.x;
            const dy = e.offsetY - lastMouse.y;
            lastMouse = { x: e.offsetX, y: e.offsetY };

            if (draggedStain) {
                const m = screenToWorld(e.offsetX, e.offsetY);
                draggedStain.x = m.x;
                draggedStain.y = m.y;
                draw();
            } else {
                view.x += dx;
                view.y += dy;
                draw();
            }
        });

        viewDiv.addEventListener("mouseup", () => {
            dragging = false;
            if (draggedStain) {
                draggedStain = null;
                sendStains();
            }
        });

        viewDiv.addEventListener("wheel", e => {
            e.preventDefault();
            const zs = 0.1;
            const delta = e.deltaY > 0 ? (1 - zs) : (1 + zs);
            const m = screenToWorld(e.offsetX, e.offsetY);
            view.scale *= delta;
            view.x = e.offsetX - m.x * view.scale;
            view.y = e.offsetY + m.y * view.scale;
            draw();
        });

        ws.onopen = () => {
            updateConfig();
        };

        ws.onmessage = (evt) => {
            try {
                const msg = JSON.parse(evt.data);
                if (msg.type === "pose") {
                    robot.x = msg.x;
                    robot.y = msg.y;
                    robot.angle = msg.angle || 0;
                    path.push({ x: msg.x, y: msg.y });
                    if (path.length > 5000) path.shift();
                    draw();
                }
                else if (msg.type === "map_point") {
                    mapPts.push(msg);
                    document.getElementById("pts-count").innerText = mapPts.length;
                    draw();
                }
                else if (msg.type === "planned_path") {
                    plan = msg.path;
                    draw();
                }
                else if (msg.type === "stain_found") {
                    foundStains.push(msg);
                    document.getElementById("stain-count").innerText = foundStains.length;
                    const div = document.createElement("div");
                    div.className = "metric-row";
                    div.innerHTML = `<span>Detection</span> <span class="metric-val">${msg.x.toFixed(0)}, ${msg.y.toFixed(0)}</span>`;
                    document.getElementById("stain-list").prepend(div);
                    draw();
                }
                else if (msg.type === "stain_removed") {
                    foundStains = foundStains.filter(s => Math.hypot(s.x - msg.x, s.y - msg.y) > 1);
                    document.getElementById("stain-count").innerText = foundStains.length;
                    stains = stains.filter(s => Math.hypot(s.x - msg.x, s.y - msg.y) > 1);
                    draw();
                }
            } catch (e) { }
        };

        function wsSend(cmd, payload = {}) {
            ws.send(JSON.stringify({ ...payload, cmd }));
        }

        function updateConfig() {
            const w = parseFloat(document.getElementById("simW").value);
            const h = parseFloat(document.getElementById("simH").value);
            const sz = parseFloat(document.getElementById("simSize").value);
            wsSend("set_sim_config", { w, h, size: sz, overlap: 0.5 });
            sendStains();
            draw();
        }

        function resetSim() {
            wsSend("reset_sim");
            mapPts = [];
            path = [];
            plan = [];
            foundStains = [];
            document.getElementById("pts-count").innerText = "0";
            document.getElementById("stain-count").innerText = "0";
            document.getElementById("stain-list").innerHTML = "";
            sendStains();
            draw();
        }

        function actionMapping() {
            updateConfig();
            wsSend("start_mapping");
        }

        function spawnStain() {
            const cx = (canvas.width / 2 - view.x) / view.scale;
            const cy = (view.y - canvas.height / 2) / view.scale;
            stains.push({ x: cx, y: cy, id: Date.now() });
            sendStains();
            draw();
        }

        function sendStains() {
            wsSend("update_sim_stains", { stains: stains.map(s => ({ x: s.x, y: s.y })) });
        }

        function clearDetections() {
            foundStains = [];
            document.getElementById("stain-count").innerText = "0";
            document.getElementById("stain-list").innerHTML = "";
        }

        function togglePause() {
            wsSend("toggle_pause");
        }

        function setSpeed(v) {
            document.getElementById("speedVal").innerText = v + "x";
            wsSend("set_speed", { speed: v });
        }

        const worldToScreen = (wx, wy) => ({
            x: wx * view.scale + view.x,
            y: view.y - wy * view.scale
        });

        const screenToWorld = (sx, sy) => ({
            x: (sx - view.x) / view.scale,
            y: (view.y - sy) / view.scale
        });

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = parseFloat(document.getElementById("simW").value) || 200;
            const h = parseFloat(document.getElementById("simH").value) || 150;

            if (assetsLoaded >= 1) {
                ctx.save();
                const pat = ctx.createPattern(imgPanel, "repeat");

                const sTL = worldToScreen(0, h);
                const sBR = worldToScreen(w, 0);
                const panelW = sBR.x - sTL.x;
                const panelH = sBR.y - sTL.y;

                ctx.save();
                ctx.beginPath();
                ctx.rect(sTL.x, sTL.y, panelW, panelH);
                ctx.clip();

                const pMat = new DOMMatrix();
                pMat.translateSelf(view.x, view.y);
                pMat.scaleSelf(view.scale / 10, -view.scale / 10);
                pat.setTransform(pMat);
                ctx.fillStyle = pat;
                ctx.fill();

                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
                ctx.restore();
            } else {
                const tl = worldToScreen(0, h);
                const br = worldToScreen(w, 0);
                ctx.strokeStyle = "#444";
                ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
            }

            for (let s of stains) {
                const scr = worldToScreen(s.x, s.y);
                if (assetsLoaded >= 2) {
                    const sz = 30 * view.scale;
                    ctx.drawImage(imgDirt, scr.x - sz / 2, scr.y - sz / 2, sz, sz);
                } else {
                    ctx.fillStyle = "#888";
                    ctx.beginPath();
                    ctx.arc(scr.x, scr.y, 10 * view.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            if (document.getElementById("pathToggle").checked && path.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 2;
                const start = worldToScreen(path[0].x, path[0].y);
                ctx.moveTo(start.x, start.y);
                for (let p of path) {
                    const s = worldToScreen(p.x, p.y);
                    ctx.lineTo(s.x, s.y);
                }
                ctx.stroke();
            }

            if (plan.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = "#fbbf24";
                ctx.setLineDash([10, 5]);
                ctx.lineWidth = 2;
                const start = worldToScreen(plan[0].x, plan[0].y);
                ctx.moveTo(start.x, start.y);
                for (let p of plan) {
                    const s = worldToScreen(p.x, p.y);
                    ctx.lineTo(s.x, s.y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.fillStyle = "rgba(59, 130, 246, 0.5)";
            for (let p of mapPts) {
                const s = worldToScreen(p.x, p.y);
                ctx.fillRect(s.x, s.y, 4 * view.scale, 4 * view.scale);
            }

            ctx.save();
            const rPos = worldToScreen(robot.x, robot.y);
            ctx.translate(rPos.x, rPos.y);
            ctx.rotate(robot.angle);

            const rSz = 28;
            const sz = rSz * view.scale;

            ctx.fillStyle = "#e4e4e7";
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.fillRect(-sz / 2, -sz / 2, sz, sz);

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(-2, -sz / 2, 4, sz / 2);
            ctx.restore();

            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;
            for (let s of foundStains) {
                const scr = worldToScreen(s.x, s.y);
                ctx.beginPath();
                ctx.arc(scr.x, scr.y, 15 * view.scale, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    </script>
</body>

</html>
